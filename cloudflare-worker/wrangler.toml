name = "fireeye-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# "wrangler d1 create fireeye_db" komutunu çalıştırdıktan sonra
# terminalde çıkan database_id'yi aşağıya yapıştır.
[[d1_databases]]
binding = "DB"
database_name = "fireeye_db"
database_id = "203a8f3c-ae0d-42e9-8f50-5c6b20261d00"

# Site içi yapay zeka asistanı (Workers AI) bağlaması
[ai]
binding = "AI"

# Kullanıcı oturum token'larını imzalamak için gizli bir anahtar gerekiyor.
# Terminalde şunu çalıştır: wrangler secret put SESSION_SECRET
# (İstediğin uzun, rastgele bir metin gir — örn. bir şifre üreticiden.)

# Cihazların (ESP32/Arduino) veri gönderirken/komut çekerken kullandığı paylaşılan şifre.
# Varsayılan: "fireeye-device-2026" — istersen değiştirmek için:
# wrangler secret put DEVICE_SECRET
# Değiştirirsen esp32_ornek_firmware.ino içindeki DEVICE_SECRET'ı da aynı yap.

# APK dosyaları Cloudflare Worker'a 100MB sınırına takılmadan gelebilir (ücretsiz plan
# istek gövdesi sınırı 100MB'dur; FireEye APK'sı ~15MB'dır). Dosya Worker'a POST edilir,
# Worker da Wasmer Edge volume'a (S3 uyumlu) yazar; site kendi adresinden servis eder.
# S3 erişimi için gereken gizli değerler:
#   wrangler secret put WASMER_S3_ENDPOINT      # "wasmer app volume credentials" çıktısındaki endpoint
#   wrangler secret put WASMER_S3_ACCESS_KEY
#   wrangler secret put WASMER_S3_SECRET_KEY
#   wrangler secret put WASMER_S3_BUCKET        # volume adı (varsayılan: downloads)
#   wrangler secret put WASMER_S3_REGION        # bölge (varsayılan: auto)
#   (opsiyonel) wrangler secret put WASMER_S3_SIGN_HOST  # "false" ise host başlığı imzalanmaz
#
# Google ile giriş (isteğe bağlı): wrangler secret put GOOGLE_CLIENT_ID
# (Aynı istemci kimliği fireeye/index.html içindeki GOOGLE_CLIENT_ID ile eşleşmeli.)

# Microsoft ile giriş (isteğe bağlı): yalnızca istemci kimliği kullanılır.
# wrangler secret put MICROSOFT_CLIENT_ID

# GitHub ile giriş (isteğe bağlı): GitHub OAuth App oluşturup iki gizli değer gir.
# Callback adresi: https://fireeye-api.SENIN-ALT-ADIN.workers.dev/auth/github/callback
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET

# Şifre sıfırlama / şifre değişikliği bildirim e-postaları AgentMail üzerinden gönderilir.
# 1) AgentMail'de bir inbox oluştur (docs.agentmail.to), inbox_id'ni kopyala.
# 2) AgentMail Console'dan bir API key oluştur.
# 3) İkisini de secret olarak ekle (terminalde):
#    wrangler secret put AGENTMAIL_API_KEY
#    wrangler secret put AGENTMAIL_INBOX_ID   (inbox_id değeri)
[vars]
# E-postalardaki "gönderen" adresi artık AgentMail inbox'ından gelir; bu satır artık kullanılmıyor.
# RESEND_FROM_EMAIL = "FireEye <no-reply@technoweb.win>"
SUPPORT_EMAIL = "technostudios11@gmail.com"
# Sitenin kendi adresi — APK indirme bağlantıları buna göre kurulur:
SITE_BASE_URL = "https://www.technoweb.win"
