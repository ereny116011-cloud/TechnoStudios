# APK dosyaları Cloudflare'e hiç uğramadan tarayıcıdan doğrudan GitHub Releases'e yüklenir
# (Cloudflare Worker'a gelen isteklerin 100MB sınırını aşmak ve R2'nin istediği kredi kartını
